; Standart ESP32-S3 DevKitC-1 (8 MB flash, WS2812 RGB LED, ADC1 = GPIO1..10)
;
; SuperMini'den farki: 8 MB flash ve daha genis pin boslugu; I2C 8/9 uzerinde.
[env:esp32s3_devkit]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
lib_deps =
    ${common.lib_deps}
build_flags =
    -I variants/esp32s3_devkit
    -DDLS_TARGET_ESP32S3_DEVKIT
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = post:copy_firmware.py
