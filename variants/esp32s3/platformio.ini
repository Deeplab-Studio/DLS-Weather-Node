; ESP32-S3 SuperMini (4 MB flash, 2 MB PSRAM, ADC1 = GPIO1..10)
;
; board = esp32-s3-devkitc-1 tanimi 8 MB flash varsayar; SuperMini 4 MB oldugu
; icin flash_size acikca 4MB'a cekilir. OTA kullanilmadigi icin 3 MB uygulama
; bolumu veren huge_app.csv secilir (default.csv 1.2 MB ile sinirda kaliyordu).
[env:esp32s3_super_mini]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
lib_deps =
    ${common.lib_deps}
build_flags =
    -I variants/esp32s3
    -DDLS_TARGET_ESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = post:copy_firmware.py
