; ESP32-S2 SuperMini / LOLIN S2 Mini (4 MB flash, native USB, ADC1 = GPIO1..10)
;
; board = lolin_s2_mini: SDA=33 / SCL=35 / LED=15 (framework board tanimi ile ayni).
[env:esp32s2_super_mini]
board = lolin_s2_mini
board_build.partitions = huge_app.csv
lib_deps =
    ${common.lib_deps}
build_flags =
    -I variants/esp32s2
    -DDLS_TARGET_ESP32S2
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = post:copy_firmware.py
