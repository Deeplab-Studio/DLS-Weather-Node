; ESP32-C3 SuperMini (4 MB flash, ADC1 = GPIO0..4)
[env:esp32c3_super_mini]
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
lib_deps =
    ${common.lib_deps}
build_flags =
    -I variants/esp32c3
    -DDLS_TARGET_ESP32C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = post:copy_firmware.py
