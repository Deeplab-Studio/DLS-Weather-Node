; Standart ESP32-WROOM / DOIT DevKit
; variant.h secimi -I + -DDLS_TARGET_* ile determinstik yapilir;
; boylece birden fazla variant.h ayni include yolunda carpismaz.
[env:esp32_wroom]
board = esp32doit-devkit-v1
; OTA yok: 3 MB uygulama bolumu (default.csv 1.2 MB ile %86 doluluk veriyordu)
board_build.partitions = huge_app.csv
lib_deps =
    ${common.lib_deps}
build_flags =
    -I variants/esp32
    -DDLS_TARGET_ESP32
extra_scripts = post:copy_firmware.py
